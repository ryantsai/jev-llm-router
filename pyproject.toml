[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-llm-router"
version = "0.2.0"
description = "Intent-aware Codex subagent routing and Responses API gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "uvicorn>=0.34,<1",
  "anyio>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8"]

[project.scripts]
jev-router = "jev_llm_router.cli:main"
jev-codex = "jev_llm_router.codex_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["jev_llm_router"]
branch = true
